<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Final Review: Real Numbers</title>
  <style>
    :root {
      --ink: #172033;
      --muted: #64748b;
      --panel: #ffffff;
      --accent: #2563eb;
      --accent-soft: #eff6ff;
      --purple: #7c3aed;
      --purple-soft: #f3e8ff;
      --green: #16a34a;
      --green-soft: #ecfdf5;
      --orange: #ea580c;
      --orange-soft: #fff7ed;
      --pink: #db2777;
      --pink-soft: #fdf2f8;
      --good: #15803d;
      --good-soft: #ecfdf5;
      --bad: #b91c1c;
      --bad-soft: #fef2f2;
      --warn: #92400e;
      --warn-soft: #fffbeb;
      --shadow: 0 12px 30px rgba(15, 23, 42, 0.10);
      --radius: 22px;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      height: 100%;
      overflow: hidden;
      margin: 0;
    }

    body {
      display: flex;
      flex-direction: column;
      padding: 12px 20px;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: linear-gradient(135deg, #f8fafc 0%, #eef2ff 100%);
      color: var(--ink);
    }

    .header {
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 14px;
      margin-bottom: 12px;
    }

    .title-wrap {
      min-width: 0;
    }

    h1 {
      margin: 0;
      font-size: clamp(1.1rem, 2.2vw, 1.7rem);
      line-height: 1.1;
      letter-spacing: -0.03em;
    }

    .subtitle {
      margin-top: 4px;
      color: var(--muted);
      font-size: clamp(0.78rem, 1.25vw, 0.95rem);
      line-height: 1.25;
    }

    .score-pill {
      flex-shrink: 0;
      border: 1px solid #c7d2fe;
      background: rgba(255, 255, 255, 0.85);
      padding: 8px 12px;
      border-radius: 999px;
      font-weight: 900;
      color: #3730a3;
      white-space: nowrap;
      font-size: 0.95rem;
    }

    .main {
      flex: 1;
      min-height: 0;
      overflow: hidden;
      display: grid;
      grid-template-columns: minmax(250px, 0.75fr) minmax(0, 1.25fr);
      gap: 14px;
    }

    .card {
      min-height: 0;
      overflow: hidden;
      background: rgba(255, 255, 255, 0.92);
      border: 1px solid rgba(203, 213, 225, 0.9);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
    }

    .number-panel {
      display: flex;
      flex-direction: column;
      min-height: 0;
      padding: 14px;
      gap: 12px;
    }

    .panel-title {
      flex-shrink: 0;
      margin: 0;
      font-size: clamp(0.95rem, 1.4vw, 1.08rem);
      font-weight: 950;
      color: #1e293b;
    }

    .number-cards {
      flex: 1;
      min-height: 0;
      overflow: hidden;
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 10px;
      align-content: start;
    }

    .number-card {
      min-width: 0;
      padding: 12px 10px;
      border-radius: 16px;
      border: 1px solid #ddd6fe;
      background: linear-gradient(145deg, #ffffff, var(--purple-soft));
      color: #4c1d95;
      font-weight: 950;
      font-size: clamp(1.05rem, 1.8vw, 1.35rem);
      text-align: center;
      cursor: pointer;
      user-select: none;
      touch-action: manipulation;
      box-shadow: 0 8px 18px rgba(15, 23, 42, 0.10);
      transition: transform 140ms ease, opacity 140ms ease, border-color 140ms ease;
    }

    .number-card:hover,
    .number-card.selected {
      transform: translateY(-1px);
      border-color: var(--purple);
    }

    .number-card:active {
      transform: translateY(1px);
    }

    .number-card.used {
      opacity: 0.28;
      cursor: default;
      transform: none;
    }

    .review-panel {
      display: flex;
      flex-direction: column;
      min-height: 0;
      padding: 14px;
      gap: 12px;
    }

    .category-boxes {
      flex: 1;
      min-height: 0;
      overflow: hidden;
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      grid-template-rows: repeat(2, minmax(0, 1fr));
      gap: 10px;
    }

    .category-box {
      min-height: 0;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      gap: 8px;
      padding: 10px;
      border-radius: 18px;
      border: 2px solid #dbeafe;
      background: #ffffff;
      cursor: pointer;
      transition: transform 140ms ease, border-color 140ms ease, background 140ms ease;
    }

    .category-box:hover,
    .category-box.active {
      transform: translateY(-1px);
      border-color: #60a5fa;
      background: #eff6ff;
    }

    .category-box.correct {
      border-color: #22c55e;
      background: var(--good-soft);
    }

    .category-box.incorrect {
      border-color: #ef4444;
      background: var(--bad-soft);
    }

    .category-title {
      flex-shrink: 0;
      font-weight: 950;
      font-size: clamp(0.8rem, 1.15vw, 0.95rem);
      color: #1e3a8a;
      line-height: 1.15;
    }

    .category-items {
      flex: 1;
      min-height: 0;
      overflow: hidden;
      display: flex;
      flex-wrap: wrap;
      align-content: flex-start;
      gap: 6px;
    }

    .placed-chip {
      padding: 6px 8px;
      border-radius: 999px;
      background: var(--purple);
      color: #ffffff;
      font-weight: 900;
      font-size: clamp(0.78rem, 1.05vw, 0.9rem);
      line-height: 1;
      white-space: nowrap;
    }

    .feedback-row {
      flex-shrink: 0;
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto auto;
      align-items: center;
      gap: 10px;
    }

    .feedback-message {
      min-height: 58px;
      display: flex;
      align-items: center;
      padding: 11px 12px;
      border-radius: 18px;
      background: var(--warn-soft);
      border: 1px solid #fde68a;
      color: var(--warn);
      font-weight: 760;
      line-height: 1.3;
      overflow: hidden;
      font-size: clamp(0.82rem, 1.1vw, 0.94rem);
    }

    .feedback-message.correct {
      background: var(--good-soft);
      border-color: #86efac;
      color: var(--good);
    }

    .feedback-message.incorrect {
      background: var(--bad-soft);
      border-color: #fca5a5;
      color: var(--bad);
    }

    button {
      border: 0;
      cursor: pointer;
      font: inherit;
      touch-action: manipulation;
    }

    .check-answer-button,
    .restart-button {
      min-height: 50px;
      padding: 11px 13px;
      border-radius: 15px;
      color: #ffffff;
      font-weight: 950;
      box-shadow: 0 8px 18px rgba(15, 23, 42, 0.14);
      white-space: nowrap;
      transition: transform 150ms ease, filter 150ms ease;
    }

    .check-answer-button {
      background: var(--accent);
    }

    .restart-button {
      background: #111827;
    }

    .check-answer-button:hover,
    .restart-button:hover {
      transform: translateY(-1px);
      filter: brightness(1.03);
    }

    .check-answer-button:active,
    .restart-button:active {
      transform: translateY(1px);
    }

    .tip {
      flex-shrink: 0;
      padding: 10px 12px;
      border-radius: 16px;
      background: var(--accent-soft);
      border: 1px solid #bfdbfe;
      color: #1e40af;
      font-size: clamp(0.78rem, 1.05vw, 0.9rem);
      font-weight: 760;
      line-height: 1.35;
    }

    @media (max-width: 860px) {
      body {
        padding: 10px 12px;
      }

      .header {
        margin-bottom: 10px;
      }

      .subtitle {
        display: none;
      }

      .main {
        grid-template-columns: 1fr;
        grid-template-rows: auto minmax(0, 1fr);
        gap: 10px;
      }

      .number-panel,
      .review-panel {
        padding: 10px;
        gap: 9px;
      }

      .number-cards {
        flex: none;
        grid-template-columns: repeat(4, minmax(0, 1fr));
        gap: 8px;
      }

      .number-card {
        padding: 9px 6px;
      }

      .category-boxes {
        grid-template-columns: repeat(3, minmax(0, 1fr));
        gap: 8px;
      }

      .feedback-row {
        grid-template-columns: minmax(0, 1fr) auto auto;
        gap: 8px;
      }

      .feedback-message {
        min-height: 50px;
        padding: 9px 10px;
      }

      .check-answer-button,
      .restart-button {
        min-height: 46px;
        padding: 9px 10px;
      }

      .tip {
        display: none;
      }
    }

    @media (max-height: 560px) {
      body {
        padding-top: 8px;
        padding-bottom: 8px;
      }

      .header {
        margin-bottom: 8px;
      }

      .subtitle {
        display: none;
      }

      .number-panel,
      .review-panel {
        padding: 9px;
        gap: 8px;
      }

      .panel-title,
      .tip {
        display: none;
      }

      .category-box {
        gap: 6px;
        padding: 8px;
      }

      .feedback-message {
        min-height: 44px;
        padding: 8px 9px;
      }

      .check-answer-button,
      .restart-button {
        min-height: 42px;
        padding: 8px 9px;
      }
    }
  </style>
</head>
<body>
  <header class="header">
    <div class="title-wrap">
      <h1>Final Review</h1>
      <div class="subtitle">Click a number, then click its most specific category.</div>
    </div>
    <div class="score-pill" id="score-display">Sorted: 0 / 8</div>
  </header>

  <main class="main">
    <section class="card number-panel">
      <p class="panel-title">Number Cards</p>
      <div class="number-cards" id="number-cards">
        <button class="number-card" id="number-card-7" data-value="7" type="button">7</button>
        <button class="number-card" id="number-card-0" data-value="0" type="button">0</button>
        <button class="number-card" id="number-card-minus-6" data-value="-6" type="button">-6</button>
        <button class="number-card" id="number-card-three-fourths" data-value="3/4" type="button">3/4</button>
        <button class="number-card" id="number-card-0-25" data-value="0.25" type="button">0.25</button>
        <button class="number-card" id="number-card-pi" data-value="π" type="button">π</button>
        <button class="number-card" id="number-card-sqrt-2" data-value="√2" type="button">√2</button>
        <button class="number-card" id="number-card-minus-8-fifths" data-value="-8/5" type="button">-8/5</button>
      </div>
      <div class="tip" id="review-tip">Tip: Use the most specific category. For example, 7 is natural, not just rational or real.</div>
    </section>

    <section class="card review-panel">
      <div class="category-boxes" id="category-boxes">
        <button class="category-box" id="natural-number-box" data-category="natural" type="button">
          <span class="category-title">Natural Numbers</span>
          <span class="category-items"></span>
        </button>
        <button class="category-box" id="whole-number-box" data-category="whole" type="button">
          <span class="category-title">Whole Numbers</span>
          <span class="category-items"></span>
        </button>
        <button class="category-box" id="integer-box" data-category="integer" type="button">
          <span class="category-title">Integers</span>
          <span class="category-items"></span>
        </button>
        <button class="category-box" id="rational-number-box" data-category="rational" type="button">
          <span class="category-title">Rational Numbers</span>
          <span class="category-items"></span>
        </button>
        <button class="category-box" id="irrational-number-box" data-category="irrational" type="button">
          <span class="category-title">Irrational Numbers</span>
          <span class="category-items"></span>
        </button>
        <button class="category-box" id="real-number-box" data-category="real" type="button">
          <span class="category-title">Real Numbers</span>
          <span class="category-items"></span>
        </button>
      </div>

      <div class="feedback-row">
        <div class="feedback-message" id="feedback-message">Select a number card to begin.</div>
        <button class="check-answer-button" id="check-answer-button" type="button">Check</button>
        <button class="restart-button" id="restart-button" type="button">Restart</button>
      </div>
    </section>
  </main>

  <script>
    const answers = {
      "7": "natural",
      "0": "whole",
      "-6": "integer",
      "3/4": "rational",
      "0.25": "rational",
      "π": "irrational",
      "√2": "irrational",
      "-8/5": "rational"
    };

    const explanations = {
      "7": "7 is a counting number, so it is natural.",
      "0": "0 is whole, but not natural in this beginner lesson.",
      "-6": "-6 is an integer because it is a negative whole number.",
      "3/4": "3/4 is rational because it is a fraction of two integers.",
      "0.25": "0.25 is rational because it is a terminating decimal.",
      "π": "π is irrational because it does not end or repeat.",
      "√2": "√2 is irrational because it cannot be written as a fraction of two integers.",
      "-8/5": "-8/5 is rational because it is a fraction of two integers."
    };

    const cards = Array.from(document.querySelectorAll(".number-card"));
    const boxes = Array.from(document.querySelectorAll(".category-box"));
    const feedback = document.getElementById("feedback-message");
    const scoreDisplay = document.getElementById("score-display");
    const checkButton = document.getElementById("check-answer-button");
    const restartButton = document.getElementById("restart-button");

    let selectedCard = null;
    let placements = {};

    function updateScore() {
      const sorted = Object.keys(placements).length;
      scoreDisplay.textContent = `Sorted: ${sorted} / ${cards.length}`;
    }

    function resetStyles() {
      boxes.forEach(box => box.classList.remove("correct", "incorrect", "active"));
    }

    function selectCard(card) {
      if (card.classList.contains("used")) return;
      cards.forEach(item => item.classList.remove("selected"));
      selectedCard = card;
      card.classList.add("selected");
      resetStyles();
      feedback.className = "feedback-message";
      feedback.textContent = `Selected ${card.dataset.value}. Now choose its most specific category.`;
    }

    function removeExistingPlacement(value) {
      boxes.forEach(box => {
        const chip = box.querySelector(`[data-chip-value="${CSS.escape(value)}"]`);
        if (chip) chip.remove();
      });
      delete placements[value];
    }

    function placeInCategory(box) {
      if (!selectedCard) {
        feedback.className = "feedback-message";
        feedback.textContent = "First select a number card, then choose a category.";
        return;
      }

      const value = selectedCard.dataset.value;
      removeExistingPlacement(value);

      const chip = document.createElement("span");
      chip.className = "placed-chip";
      chip.textContent = value;
      chip.dataset.chipValue = value;
      box.querySelector(".category-items").appendChild(chip);

      placements[value] = box.dataset.category;
      selectedCard.classList.add("used");
      selectedCard.classList.remove("selected");
      selectedCard = null;

      resetStyles();
      feedback.className = "feedback-message";
      feedback.textContent = "Placed. Continue sorting the remaining numbers.";
      updateScore();
    }

    function checkAnswers() {
      let correct = 0;
      let placed = Object.keys(placements).length;

      resetStyles();

      Object.entries(placements).forEach(([value, category]) => {
        const box = boxes.find(item => item.dataset.category === category);
        if (!box) return;

        if (answers[value] === category) {
          correct += 1;
          box.classList.add("correct");
        } else {
          box.classList.add("incorrect");
        }
      });

      if (placed < cards.length) {
        feedback.className = "feedback-message";
        feedback.textContent = `You sorted ${placed} out of ${cards.length}. Sort every card before finishing.`;
        return;
      }

      if (correct === cards.length) {
        feedback.className = "feedback-message correct";
        feedback.textContent = "Excellent. Every number is in its most specific category.";
      } else {
        feedback.className = "feedback-message incorrect";
        const firstWrong = Object.keys(placements).find(value => placements[value] !== answers[value]);
        feedback.textContent = `${correct} out of ${cards.length} are correct. Hint: ${explanations[firstWrong]}`;
      }
    }

    function restart() {
      selectedCard = null;
      placements = {};
      cards.forEach(card => card.classList.remove("used", "selected"));
      boxes.forEach(box => {
        box.classList.remove("correct", "incorrect", "active");
        box.querySelector(".category-items").innerHTML = "";
      });
      feedback.className = "feedback-message";
      feedback.textContent = "Select a number card to begin.";
      updateScore();
    }

    cards.forEach(card => {
      card.addEventListener("click", () => selectCard(card));
    });

    boxes.forEach(box => {
      box.addEventListener("click", () => placeInCategory(box));
    });

    checkButton.addEventListener("click", checkAnswers);
    restartButton.addEventListener("click", restart);

    updateScore();
  </script>

  <script>
    window.addEventListener('message', function(event) {
      const data = event.data;
      if (!data || (data.type !== 'SHOW_COMPONENT' && data.type !== 'CLICK_COMPONENT')) return;

      const name = data.name || '';
      let el = document.getElementById(data.id);

      if (!el && name) {
        const valMatch = name.match(/(-?\d+(\.\d+)?)/);
        const val = valMatch ? valMatch[0] : null;
        
        const lowerName = name.toLowerCase();
        if (lowerName.includes('drop point') && val) {
          el = document.querySelector('.drop-point[data-value="' + val + '"]');
        } else if (lowerName.includes('number card') && val) {
          el = document.querySelector('.number-card[data-value="' + val + '"]');
        } else if (lowerName.includes('reset')) {
          el = document.getElementById('reset-button') || document.querySelector('.reset-button');
        } else if (lowerName.includes('check')) {
          el = document.getElementById('check-answer-button') || document.querySelector('.check-answer-button');
        } else if (lowerName.includes('natural')) {
          el = document.querySelector('.bucket[data-target="natural"]');
        } else if (lowerName.includes('whole')) {
          el = document.querySelector('.bucket[data-target="whole"]');
        } else if (lowerName.includes('integer')) {
          el = document.querySelector('.bucket[data-target="integer"]');
        } else if (lowerName.includes('rational')) {
          el = document.querySelector('.bucket[data-target="rational"]');
        } else if (lowerName.includes('irrational')) {
          el = document.querySelector('.bucket[data-target="irrational"]');
        } else if (lowerName.includes('real')) {
          el = document.querySelector('.bucket[data-target="real"]');
        }
      }

      if (el) {
        const oldOutline = el.style.outline;
        const oldOutlineOffset = el.style.outlineOffset;
        const oldBoxShadow = el.style.boxShadow;
        
        el.style.outline = '4px solid #3b82f6';
        el.style.outlineOffset = '4px';
        el.style.boxShadow = '0 0 15px rgba(59, 130, 246, 0.5)';
        
        setTimeout(() => {
          el.style.outline = oldOutline;
          el.style.outlineOffset = oldOutlineOffset;
          el.style.boxShadow = oldBoxShadow;
        }, 2000);

        if (data.type === 'CLICK_COMPONENT') {
          setTimeout(() => el.click(), 500);
        }
      }
    });
  </script>
</body>

</html>
